<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found | Argusvane</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this file for any missing URL, at any depth, so the
       base element below is set by script to the folder this file lives in.
       That keeps the relative asset and home links working on a project site
       (user.github.io/repo/) and on a custom domain alike. -->
  <script>
    (function () {
      var parts = location.pathname.split('/');
      var onProjectSite = /\.github\.io$/.test(location.hostname) && parts.length > 2;
      var base = document.createElement('base');
      base.href = onProjectSite ? '/' + parts[1] + '/' : '/';
      document.head.appendChild(base);
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="av-mark" viewBox="60 0 80 122">
    <path class="f-line" d="M100 6 C138 36 138 84 100 100 C62 84 62 36 100 6 Z" stroke-width="7" stroke-linejoin="miter"></path>
    <circle class="f-pupil" cx="100" cy="64" r="13"></circle>
    <line class="f-line" x1="100" y1="100" x2="100" y2="121" stroke-width="7"></line>
  </symbol>
</svg>

<header class="top">
  <div class="wrap">
    <a class="brand" href="./" aria-label="Argusvane home">
      <svg aria-hidden="true"><use href="#av-mark"></use></svg>
      <span>ARGUSVANE</span>
    </a>
  </div>
</header>

<main class="lost">
  <div class="wrap">
    <p class="label tag">Error 404</p>
    <h1>Nothing in view at this address.</h1>
    <p>The page you asked for does not exist, or it has moved. The home page has everything we publish.</p>
    <a class="btn" href="./">Return to the home page</a>
  </div>
</main>

</body>
</html>
